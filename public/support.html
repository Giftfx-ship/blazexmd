<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat Support · BLAZE-XMD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ============================================================
           ROOT & RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #25D366;
            --primary-dark: #075E54;
            --primary-teal: #128C7E;
            --primary-glow: rgba(37, 211, 102, 0.25);
            --bg: #0A0A0A;
            --bg-card: rgba(255,255,255,0.03);
            --card: #1A1A1A;
            --card-hover: #242424;
            --text: #FFFFFF;
            --muted: #94A3B8;
            --border: rgba(255,255,255,0.06);
            --radius: 16px;
            --radius-xl: 24px;
            --shadow: 0 8px 40px rgba(0,0,0,0.4);
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #22C55E;
            --danger: #DC2626;
            --warning: #F59E0B;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ============================================================
           ANIMATED BACKGROUND
           ============================================================ */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.2;
            animation: orbFloat 30s ease-in-out infinite alternate;
        }

        .bg-glow .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--primary);
            top: -300px;
            right: -200px;
            animation-delay: 0s;
        }

        .bg-glow .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--primary-teal);
            bottom: -300px;
            left: -200px;
            animation-delay: -10s;
        }

        .bg-glow .orb-3 {
            width: 400px;
            height: 400px;
            background: var(--primary-dark);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -20s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(60px, -80px) scale(1.1); }
            50% { transform: translate(-40px, 70px) scale(0.9); }
            75% { transform: translate(80px, 40px) scale(1.05); }
            100% { transform: translate(-20px, -30px) scale(0.95); }
        }

        /* ============================================================
           CONTAINER
           ============================================================ */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-teal));
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: var(--bg);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-back {
            padding: 8px 20px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 60px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        /* ============================================================
           EMAIL SECTION
           ============================================================ */
        .email-section {
            padding: 20px 0 16px;
            border-bottom: 1px solid var(--border);
        }

        .email-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .email-form .field-group {
            display: flex;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .email-form input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-family: inherit;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            outline: none;
            transition: all var(--transition);
            min-width: 120px;
        }

        .email-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .email-form input::placeholder {
            color: var(--muted);
        }

        .email-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-teal));
            color: var(--bg);
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--primary-glow);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(37, 211, 102, 0.05);
        }

        .btn-outline:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status-message {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        .status-message.show { display: block; }
        .status-message.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }
        .status-message.error {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
            border: 1px solid rgba(220, 38, 38, 0.15);
        }
        .status-message.info {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .info-text {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
            text-align: center;
        }

        /* ============================================================
           CHAT CONTAINER
           ============================================================ */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0 32px;
            max-height: calc(100vh - 300px);
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
            animation: pulseDot 2s ease infinite;
        }

        .status-dot.offline {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .status-info { flex: 1; }
        .status-info .title { font-weight: 600; font-size: 14px; }
        .status-info .sub { font-size: 12px; color: var(--muted); }

        .status-badge {
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(37, 211, 102, 0.12);
            color: var(--primary);
        }

        .status-badge.offline {
            background: rgba(220, 38, 38, 0.12);
            color: var(--danger);
        }

        /* ============================================================
           MESSAGES
           ============================================================ */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            min-height: 250px;
            max-height: 400px;
            backdrop-filter: blur(10px);
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .chat-message {
            margin-bottom: 12px;
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-message.user {
            background: linear-gradient(135deg, var(--primary), var(--primary-teal));
            color: var(--bg);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-message.admin {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .chat-message.system {
            background: rgba(255,255,255,0.02);
            color: var(--muted);
            text-align: center;
            font-size: 12px;
            max-width: 100%;
            border: none;
        }

        .chat-message .sender-name {
            font-size: 11px;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .chat-message.user .sender-name {
            color: rgba(0,0,0,0.6);
        }

        .chat-message.admin .sender-name {
            color: var(--primary);
        }

        .chat-message .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
        }

        .chat-message.user .msg-time {
            color: rgba(0,0,0,0.5);
        }

        .chat-message .email-label {
            font-size: 10px;
            color: var(--muted);
            display: block;
            margin-top: 2px;
        }

        .empty-messages {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
        }

        .empty-messages .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        /* ============================================================
           INPUT AREA
           ============================================================ */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-top: 12px;
            backdrop-filter: blur(10px);
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-family: inherit;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            outline: none;
            transition: all var(--transition);
        }

        .input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .input-area input::placeholder {
            color: var(--muted);
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-teal));
            color: var(--bg);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 32px var(--primary-glow);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-footer-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            padding: 0 4px;
        }

        .chat-footer-info strong {
            color: var(--success);
        }

        /* ============================================================
           SUPPORT NUMBERS
           ============================================================ */
        .support-numbers-section {
            margin-top: 16px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .support-numbers-section h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--muted);
        }

        .support-numbers-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .support-number-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            text-decoration: none;
            color: var(--text);
            font-size: 13px;
        }

        .support-number-item:hover {
            border-color: var(--primary);
            background: rgba(37, 211, 102, 0.04);
        }

        .support-number-item .flag {
            font-size: 22px;
        }

        .support-number-item .info {
            flex: 1;
        }

        .support-number-item .info .name {
            font-weight: 600;
        }

        .support-number-item .info .phone {
            color: var(--muted);
            font-size: 12px;
        }

        .support-number-item .whatsapp-icon {
            color: var(--primary);
            font-size: 18px;
        }

        .empty-support {
            padding: 12px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            color: var(--text);
            padding: 12px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: var(--danger);
        }

        .toast.success {
            border-color: var(--primary);
        }

        .toast.warning {
            border-color: var(--warning);
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .email-form {
                flex-direction: column;
            }
            .email-form .field-group {
                flex-direction: column;
                width: 100%;
            }
            .email-form input {
                width: 100%;
            }
            .email-buttons {
                width: 100%;
            }
            .email-buttons .btn {
                flex: 1;
                text-align: center;
                font-size: 12px;
                padding: 8px 12px;
            }
            .messages {
                min-height: 180px;
                max-height: 300px;
                padding: 12px 14px;
            }
            .chat-message {
                max-width: 95%;
                font-size: 13px;
                padding: 8px 12px;
            }
            .input-area {
                flex-direction: column;
                padding: 10px 12px;
            }
            .input-area button {
                width: 100%;
            }
            .support-numbers-section {
                padding: 12px 16px;
            }
            .header {
                padding: 14px 0;
            }
            .logo {
                font-size: 18px;
            }
            .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 13px;
            }
            .btn-back {
                font-size: 12px;
                padding: 6px 14px;
            }
            .chat-status {
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }
            .messages {
                max-height: 220px;
                min-height: 150px;
            }
            .email-buttons .btn {
                font-size: 11px;
                padding: 6px 10px;
            }
            .support-number-item {
                font-size: 12px;
                padding: 6px 10px;
            }
            .support-number-item .flag {
                font-size: 18px;
            }
            .toast {
                font-size: 12px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ============ BACKGROUND GLOW ============ -->
    <div class="bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- ============ HEADER ============ -->
    <header class="header">
        <div class="container" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <a href="/" class="logo">
                <span class="logo-icon">⚡</span>
                BLAZE<span>XMD</span>
            </a>
            <a href="/" class="btn-back">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
    </header>

    <!-- ============ EMAIL SECTION ============ -->
    <div class="email-section" id="emailSection">
        <div class="container">
            <div class="email-form">
                <div class="field-group">
                    <input type="email" id="emailInput" placeholder="Your email address" />
                    <input type="text" id="nameInput" placeholder="Your name (optional)" />
                </div>
                <div class="email-buttons">
                    <button class="btn btn-primary" id="continueBtn" disabled>
                        <i class="fas fa-history"></i> Continue Old
                    </button>
                    <button class="btn btn-outline" id="newBtn" disabled>
                        <i class="fas fa-plus"></i> Start New
                    </button>
                </div>
            </div>
            <div class="status-message" id="statusMessage"></div>
            <div class="info-text">
                <i class="fas fa-info-circle"></i> Enter your email then choose an option above
            </div>
        </div>
    </div>

    <!-- ============ CHAT CONTAINER ============ -->
    <div class="chat-container" id="chatContainer">
        <div class="container">

            <!-- Status -->
            <div class="chat-status">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-info">
                    <div class="title" id="chatTitle">💬 Live Chat Support</div>
                    <div class="sub" id="statusText">Online - Replies within seconds</div>
                </div>
                <span class="status-badge" id="statusBadge">🟢 Online</span>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="empty-messages" id="emptyMessages">
                    <span class="icon">💬</span>
                    <p>Enter your email above to start chatting</p>
                    <p style="font-size:12px; margin-top:4px; color:var(--muted);">We typically reply within seconds</p>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Type your message..." disabled />
                <button id="chatSendBtn" disabled>
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
            <div class="chat-footer-info">
                <span><i class="fas fa-lock"></i> Encrypted</span>
                <span>Usually replies in <strong>2-5 minutes</strong></span>
            </div>

            <!-- Support Numbers -->
            <div class="support-numbers-section">
                <h4><i class="fas fa-phone"></i> Support Numbers</h4>
                <div class="support-numbers-list" id="supportNumbers"></div>
                <div id="emptySupport" class="empty-support" style="display:none;">
                    📭 No support numbers added yet
                </div>
            </div>

        </div>
    </div>

    <!-- ============ TOAST ============ -->
    <div class="toast" id="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ============ STATE ============
        let visitorId = null;
        let userEmail = '';
        let userName = '';
        let adminName = 'Support Team';
        let isOnline = true;
        let isChatActive = false;
        let socket = null;

        // ============ DOM REFS ============
        const emailInput = document.getElementById('emailInput');
        const nameInput = document.getElementById('nameInput');
        const continueBtn = document.getElementById('continueBtn');
        const newBtn = document.getElementById('newBtn');
        const statusMessage = document.getElementById('statusMessage');

        const messages = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const chatTitle = document.getElementById('chatTitle');
        const emptyMessages = document.getElementById('emptyMessages');
        const supportNumbers = document.getElementById('supportNumbers');
        const emptySupport = document.getElementById('emptySupport');

        // ============ TOAST ============
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============ UPDATE BUTTONS ============
        function updateButtons() {
            const email = emailInput.value.trim();
            const hasEmail = email.length > 0 && email.includes('@');
            continueBtn.disabled = !hasEmail;
            newBtn.disabled = !hasEmail;
        }

        emailInput.addEventListener('input', updateButtons);
        nameInput.addEventListener('input', updateButtons);

        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !continueBtn.disabled) continueBtn.click();
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !continueBtn.disabled) continueBtn.click();
        });

        // ============ STATUS MESSAGE ============
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type + ' show';
        }

        function hideStatus() {
            statusMessage.className = 'status-message';
        }

        // ============ FETCH SETTINGS ============
        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if (data) {
                    isOnline = data.isOnline !== undefined ? data.isOnline : true;
                    adminName = data.adminName || 'Support Team';
                    updateOnlineStatus(isOnline);
                }
            } catch (error) {
                console.error('Error fetching settings:', error);
            }
        }

        function updateOnlineStatus(online) {
            if (online) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Online - Replies within seconds';
                statusBadge.textContent = '🟢 Online';
                statusBadge.className = 'status-badge';
                if (isChatActive) {
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.placeholder = 'Type your message...';
                }
            } else {
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Offline - We\'ll reply within 24h';
                statusBadge.textContent = '🔴 Offline';
                statusBadge.className = 'status-badge offline';
                chatInput.disabled = true;
                chatSendBtn.disabled = true;
                chatInput.placeholder = 'Support is currently offline';
            }
        }

        // ============ FETCH SUPPORT NUMBERS ============
        async function fetchSupportNumbers() {
            try {
                const res = await fetch('/api/support');
                const data = await res.json();
                if (data && data.length > 0) {
                    supportNumbers.innerHTML = data.map(s => `
                        <a href="https://wa.me/${s.phone}" target="_blank" class="support-number-item">
                            <span class="flag">${s.countryFlag}</span>
                            <div class="info">
                                <div class="name">${s.name}</div>
                                <div class="phone">${s.countryCode} ${s.phone}</div>
                            </div>
                            <span class="whatsapp-icon"><i class="fab fa-whatsapp"></i></span>
                        </a>
                    `).join('');
                    supportNumbers.style.display = 'flex';
                    emptySupport.style.display = 'none';
                } else {
                    supportNumbers.style.display = 'none';
                    emptySupport.style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching support numbers:', error);
            }
        }

        // ============ CHAT FUNCTIONS ============
        function scrollToBottom() {
            setTimeout(() => {
                messages.scrollTop = messages.scrollHeight;
            }, 50);
        }

        function addMessageToUI(message, isAdmin = false, adminNameText = '', isSystem = false, email = '') {
            emptyMessages.style.display = 'none';

            const div = document.createElement('div');
            div.className = `chat-message ${isSystem ? 'system' : isAdmin ? 'admin' : 'user'}`;
            
            let html = '';
            
            // ✅ Show sender name like WhatsApp
            if (isAdmin && adminNameText && !isSystem) {
                html += `<span class="sender-name">👤 ${adminNameText}</span>`;
            } else if (!isAdmin && !isSystem && email) {
                html += `<span class="sender-name">👤 You (${email})</span>`;
            } else if (!isAdmin && !isSystem) {
                html += `<span class="sender-name">👤 You</span>`;
            }
            
            html += message;
            if (email && !isSystem) {
                html += `<span class="email-label">📧 ${email}</span>`;
            }
            html += `<span class="msg-time">${new Date().toLocaleTimeString()}</span>`;
            div.innerHTML = html;
            messages.appendChild(div);
            scrollToBottom();
        }

        // ============ LOAD MESSAGES ============
        function loadMessages(messagesData) {
            messages.innerHTML = '';
            if (messagesData && messagesData.length > 0) {
                messagesData.forEach(msg => {
                    const isAdmin = msg.isFromAdmin || false;
                    const adminNameText = msg.adminName || 'Support Team';
                    addMessageToUI(msg.message, isAdmin, adminNameText, false, msg.email || '');
                });
            } else {
                emptyMessages.style.display = 'block';
            }
        }

        // ============ CONTINUE CONVERSATION ============
        continueBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const name = nameInput.value.trim() || email.split('@')[0] || 'Guest';

            if (!email || !email.includes('@')) {
                showStatus('Please enter a valid email address', 'error');
                return;
            }

            continueBtn.disabled = true;
            continueBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';

            try {
                const res = await fetch('/api/chat/check-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (data.exists) {
                    visitorId = data.session.visitorId;
                    userEmail = email;
                    userName = name;
                    isChatActive = true;
                    
                    loadMessages(data.messages);
                    chatTitle.textContent = `💬 ${email} (${data.totalMessages} messages)`;
                    
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.placeholder = 'Type your message...';
                    
                    connectSocket();
                    
                    showStatus(`✅ Welcome back! ${data.totalMessages} messages loaded`, 'success');
                    showToast(`✅ Loaded ${data.totalMessages} messages`, 'success');
                } else {
                    showStatus('❌ No conversation found. Try "Start New Conversation"', 'error');
                }
            } catch (error) {
                console.error('Error checking email:', error);
                showStatus('Error checking email. Please try again.', 'error');
            } finally {
                continueBtn.disabled = false;
                continueBtn.innerHTML = '<i class="fas fa-history"></i> Continue Old';
            }
        });

        // ============ START NEW CONVERSATION ============
        newBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const name = nameInput.value.trim() || email.split('@')[0] || 'Guest';

            if (!email || !email.includes('@')) {
                showStatus('Please enter a valid email address', 'error');
                return;
            }

            if (!confirm(`⚠️ This will delete ALL existing messages for ${email} and start fresh. Continue?`)) {
                return;
            }

            newBtn.disabled = true;
            newBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                const res = await fetch('/api/chat/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, name })
                });

                const data = await res.json();

                if (data.success) {
                    visitorId = data.visitorId;
                    userEmail = email;
                    userName = name;
                    isChatActive = true;
                    
                    messages.innerHTML = '';
                    emptyMessages.style.display = 'block';
                    chatTitle.textContent = `💬 ${email} (New)`;
                    
                    chatInput.disabled = false;
                    chatSendBtn.disabled = false;
                    chatInput.placeholder = 'Type your message...';
                    
                    connectSocket();
                    
                    addMessageToUI('👋 New conversation started! How can we help you?', true, 'Support Team', false, email);
                    
                    showStatus('✅ New conversation started!', 'success');
                    showToast('✅ New conversation created!', 'success');
                } else {
                    showStatus('❌ Failed to create conversation', 'error');
                }
            } catch (error) {
                console.error('Error creating session:', error);
                showStatus('Error creating conversation. Please try again.', 'error');
            } finally {
                newBtn.disabled = false;
                newBtn.innerHTML = '<i class="fas fa-plus"></i> Start New';
            }
        });

        // ============ SEND MESSAGE ============
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message || !visitorId || !isChatActive) return;
            if (!isOnline) {
                addMessageToUI('⚠️ Support is currently offline. Please try again later.', false, '', true);
                chatInput.value = '';
                return;
            }

            chatSendBtn.disabled = true;
            chatSendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            addMessageToUI(message, false, '', false, userEmail);

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        visitorId: visitorId,
                        name: userName || 'Guest',
                        email: userEmail,
                        message: message
                    })
                });

                const data = await res.json();
                if (!data.success) {
                    console.error('❌ Failed to save message:', data.error);
                    showToast('⚠️ Message not saved. Please try again.', 'error');
                }
            } catch (error) {
                console.error('❌ Error sending message:', error);
                showToast('⚠️ Error sending message. Please try again.', 'error');
            }

            if (socket && socket.connected) {
                socket.emit('visitor-message', {
                    visitorId,
                    name: userName || 'Guest',
                    email: userEmail,
                    message
                });
            }

            chatInput.value = '';
            chatSendBtn.disabled = false;
            chatSendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
        }

        chatSendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ============ CONNECT SOCKET ============
        function connectSocket() {
            if (socket) socket.disconnect();
            socket = io();

            socket.on('connect', () => {
                console.log('✅ Socket connected');
                if (visitorId) {
                    socket.emit('join-room', visitorId);
                }
            });

            socket.on('admin-reply', (data) => {
                addMessageToUI(data.message, true, data.adminName, false, userEmail);
            });

            socket.on('message-deleted', (data) => {
                if (data.visitorId === visitorId) {
                    fetch(`/api/chat/messages/${visitorId}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.messages) loadMessages(data.messages);
                        });
                }
            });

            socket.on('session-cleared', (data) => {
                if (data.visitorId === visitorId) {
                    messages.innerHTML = '';
                    emptyMessages.style.display = 'block';
                }
            });

            socket.on('disconnect', () => {
                console.log('⚠️ Socket disconnected');
            });
        }

        // ============ INIT ============
        async function init() {
            await fetchSettings();
            await fetchSupportNumbers();
            updateButtons();
            
            console.log('🚀 BLAZE-XMD Support Chat loaded');
            console.log('💬 Email form always visible');
        }

        init();
    </script>
</body>
</html>
