<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat Support · BLAZE-XMD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #25D366;
            --primary-dark: #075E54;
            --primary-teal: #128C7E;
            --bg: #0A0A0A;
            --card: #1A1A1A;
            --card-hover: #242424;
            --text: #FFFFFF;
            --muted: #94A3B8;
            --border: #2A2A2A;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ============ HEADER ============ */
        .header {
            padding: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-icon {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            text-align: center;
            line-height: 32px;
            font-size: 16px;
            font-weight: 700;
            color: var(--bg);
            margin-right: 8px;
        }

        .btn-back {
            padding: 8px 20px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            font-family: inherit;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        /* ============ CHAT CONTAINER ============ */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 0 32px;
            max-height: calc(100vh - 100px);
        }

        .chat-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }

        .status-dot.offline {
            background: #DC2626;
        }

        .status-info {
            flex: 1;
        }

        .status-info .title {
            font-weight: 600;
            font-size: 15px;
        }

        .status-info .sub {
            font-size: 13px;
            color: var(--muted);
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(37, 211, 102, 0.15);
            color: var(--primary);
        }

        .status-badge.offline {
            background: rgba(220, 38, 38, 0.15);
            color: #DC2626;
        }

        /* ============ MESSAGES ============ */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            min-height: 300px;
            max-height: 500px;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .chat-message {
            margin-bottom: 12px;
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.user {
            background: var(--primary);
            color: var(--bg);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .chat-message.admin {
            background: var(--card-hover);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .chat-message .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
        }

        .chat-message.user .msg-time {
            color: rgba(0,0,0,0.5);
        }

        .chat-message .admin-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
            display: block;
        }

        .chat-message.system {
            background: rgba(255,255,255,0.03);
            color: var(--muted);
            text-align: center;
            font-size: 12px;
            max-width: 100%;
            border: none;
        }

        .empty-messages {
            text-align: center;
            color: var(--muted);
            padding: 40px 20px;
        }

        .empty-messages .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* ============ INPUT ============ */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color var(--transition);
        }

        .input-area input:focus {
            border-color: var(--primary);
        }

        .input-area input::placeholder {
            color: var(--muted);
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            padding: 12px 28px;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .input-area button:hover {
            background: var(--primary-teal);
            transform: scale(1.02);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============ SUPPORT NUMBERS ============ */
        .support-numbers-section {
            margin-top: 20px;
            padding: 16px 20px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .support-numbers-section h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--muted);
        }

        .support-numbers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .support-number-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all var(--transition);
            text-decoration: none;
            color: var(--text);
        }

        .support-number-item:hover {
            border-color: var(--primary);
            background: rgba(37, 211, 102, 0.05);
        }

        .support-number-item .flag {
            font-size: 24px;
        }

        .support-number-item .info {
            flex: 1;
        }

        .support-number-item .info .name {
            font-size: 13px;
            font-weight: 600;
        }

        .support-number-item .info .phone {
            font-size: 12px;
            color: var(--muted);
        }

        .support-number-item .whatsapp-icon {
            color: var(--primary);
            font-size: 20px;
        }

        .empty-support {
            padding: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 640px) {
            .header {
                padding: 14px 0;
            }

            .logo {
                font-size: 17px;
            }

            .logo-icon {
                width: 28px;
                height: 28px;
                line-height: 28px;
                font-size: 13px;
            }

            .chat-status {
                flex-wrap: wrap;
            }

            .status-badge {
                margin-left: auto;
            }

            .messages {
                min-height: 200px;
                max-height: 350px;
                padding: 12px 14px;
            }

            .input-area {
                flex-direction: column;
                padding: 12px 16px;
            }

            .input-area button {
                width: 100%;
            }

            .chat-message {
                max-width: 95%;
                font-size: 13px;
                padding: 8px 12px;
            }

            .support-numbers-section {
                padding: 12px 16px;
            }

            .btn-back {
                font-size: 12px;
                padding: 6px 14px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 0 12px;
            }

            .messages {
                max-height: 250px;
                min-height: 150px;
            }

            .status-info .title {
                font-size: 13px;
            }

            .status-info .sub {
                font-size: 11px;
            }

            .support-number-item {
                padding: 8px 10px;
            }

            .support-number-item .flag {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header class="header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="/" class="logo">
                <span class="logo-icon">⚡</span>BLAZE<span>XMD</span>
            </a>
            <a href="/" class="btn-back">← Back to Home</a>
        </div>
    </header>

    <!-- ============ CHAT ============ -->
    <main class="chat-container">
        <div class="container">

            <!-- Status -->
            <div class="chat-status">
                <div class="status-dot" id="statusDot"></div>
                <div class="status-info">
                    <div class="title">💬 Live Chat Support</div>
                    <div class="sub" id="statusText">Online - Replies within seconds</div>
                </div>
                <span class="status-badge" id="statusBadge">🟢 Online</span>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="empty-messages" id="emptyMessages">
                    <div class="icon">💬</div>
                    <p>Start a conversation with our support team.</p>
                    <p style="font-size: 12px; margin-top: 4px;">We typically reply within seconds.</p>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Type your message..." disabled />
                <button id="chatSendBtn" disabled>Send</button>
            </div>

            <!-- Support Numbers -->
            <div class="support-numbers-section">
                <h4>📞 Support Numbers</h4>
                <div class="support-numbers-list" id="supportNumbers">
                    <!-- Dynamically loaded -->
                </div>
                <div id="emptySupport" class="empty-support" style="display: none;">
                    📭 No support numbers added yet
                </div>
            </div>

        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ============ CONFIG ============
        const PAIR_SITE_URL = 'https://blaze.zone.id';

        // ============ DOM REFS ============
        const messages = document.getElementById('messages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusBadge = document.getElementById('statusBadge');
        const emptyMessages = document.getElementById('emptyMessages');
        const supportNumbers = document.getElementById('supportNumbers');
        const emptySupport = document.getElementById('emptySupport');

        // ============ SOCKET.IO ============
        const socket = io();

        // Generate visitor ID
        let visitorId = localStorage.getItem('visitorId');
        if (!visitorId) {
            visitorId = 'visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('visitorId', visitorId);
        }

        let visitorName = 'Guest';
        let adminName = 'Support Team';
        let isOnline = true;
        let messagesLoaded = false;

        // ============ FETCH SETTINGS ============
        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if (data) {
                    isOnline = data.isOnline !== undefined ? data.isOnline : true;
                    adminName = data.adminName || 'Support Team';
                    updateOnlineStatus(isOnline);
                }
            } catch (error) {
                console.error('Error fetching settings:', error);
            }
        }

        function updateOnlineStatus(online) {
            if (online) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Online - Replies within seconds';
                statusBadge.textContent = '🟢 Online';
                statusBadge.className = 'status-badge';
                chatInput.disabled = false;
                chatSendBtn.disabled = false;
                chatInput.placeholder = 'Type your message...';
            } else {
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Offline - Please try again later';
                statusBadge.textContent = '🔴 Offline';
                statusBadge.className = 'status-badge offline';
                chatInput.disabled = true;
                chatSendBtn.disabled = true;
                chatInput.placeholder = 'Support is currently offline';
            }
        }

        // ============ FETCH SUPPORT NUMBERS ============
        async function fetchSupportNumbers() {
            try {
                const res = await fetch('/api/support');
                const data = await res.json();
                if (data && data.length > 0) {
                    supportNumbers.innerHTML = data.map(s => `
                        <a href="https://wa.me/${s.phone}" target="_blank" class="support-number-item">
                            <span class="flag">${s.countryFlag}</span>
                            <div class="info">
                                <div class="name">${s.name}</div>
                                <div class="phone">${s.countryCode} ${s.phone}</div>
                            </div>
                            <span class="whatsapp-icon">💬</span>
                        </a>
                    `).join('');
                    supportNumbers.style.display = 'flex';
                    emptySupport.style.display = 'none';
                } else {
                    supportNumbers.style.display = 'none';
                    emptySupport.style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching support numbers:', error);
                supportNumbers.style.display = 'none';
                emptySupport.style.display = 'block';
            }
        }

        // ============ CHAT FUNCTIONS ============
        function scrollToBottom() {
            setTimeout(() => {
                messages.scrollTop = messages.scrollHeight;
            }, 50);
        }

        function addMessage(message, isAdmin = false, adminNameText = '', isSystem = false) {
            // Remove empty messages placeholder
            emptyMessages.style.display = 'none';

            const div = document.createElement('div');
            div.className = `chat-message ${isSystem ? 'system' : isAdmin ? 'admin' : 'user'}`;
            
            let html = '';
            if (isAdmin && adminNameText && !isSystem) {
                html += `<span class="admin-name">${adminNameText}</span>`;
            }
            html += message;
            html += `<span class="msg-time">${new Date().toLocaleTimeString()}</span>`;
            div.innerHTML = html;
            messages.appendChild(div);
            scrollToBottom();
        }

        // ============ LOAD MESSAGE HISTORY ============
        async function loadMessageHistory() {
            try {
                const res = await fetch(`/api/chat/messages/${visitorId}`);
                const data = await res.json();
                if (data.messages && data.messages.length > 0) {
                    emptyMessages.style.display = 'none';
                    data.messages.forEach(msg => {
                        const isAdmin = msg.isFromAdmin || false;
                        const adminNameText = msg.adminName || 'Support Team';
                        addMessage(msg.message, isAdmin, adminNameText);
                    });
                }
                messagesLoaded = true;
            } catch (error) {
                console.error('Error loading message history:', error);
            }
        }

        // ============ SEND MESSAGE ============
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            if (!isOnline) {
                addMessage('⚠️ Support is currently offline. Please try again later.', false, '', true);
                chatInput.value = '';
                return;
            }

            chatSendBtn.disabled = true;
            chatSendBtn.textContent = 'Sending...';

            // Add user message to UI
            addMessage(message, false);

            // Send to server
            socket.emit('visitor-message', {
                visitorId,
                name: visitorName,
                message
            });

            chatInput.value = '';
            chatSendBtn.disabled = false;
            chatSendBtn.textContent = 'Send';
        }

        // ============ SOCKET EVENTS ============
        socket.on('connect', () => {
            console.log('✅ Socket connected');
            socket.emit('join-room', visitorId);
            if (!messagesLoaded) {
                loadMessageHistory();
            }
        });

        socket.on('admin-reply', (data) => {
            addMessage(data.message, true, data.adminName);
        });

        socket.on('disconnect', () => {
            console.log('⚠️ Socket disconnected');
        });

        // ============ EVENT LISTENERS ============
        chatSendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ============ INIT ============
        fetchSettings();
        fetchSupportNumbers();

        // Welcome message after delay
        setTimeout(() => {
            if (messages.children.length === 0) {
                addMessage('👋 Welcome! How can we help you today?', true, 'Support Team');
            }
        }, 800);

        console.log('🚀 BLAZE-XMD Support Chat loaded');
        console.log('👤 Visitor ID:', visitorId);
    </script>
</body>
</html>
